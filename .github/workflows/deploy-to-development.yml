name: Deploy to development

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA or ref to deploy (defaults to current HEAD)'
        type: string
        required: false
  pull_request_target:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

jobs:
  authorize:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'needs-deployment') &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-deployment')) ||
      (github.event.pull_request.head.repo.full_name != github.repository &&
       contains(github.event.pull_request.labels.*.name, 'needs-fork-deployment') &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-fork-deployment'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: trade-tariff/trade-tariff-tools/.github/actions/authorize-development-deployment@main
        id: authorize

  deploy:
    needs: authorize
    permissions:
      contents: read
      id-token: write
    uses: trade-tariff/trade-tariff-tools/.github/workflows/deploy-ecs.yml@main
    with:
      app-name: tariff-backend
      environment: development
      test-flavour: none
      migrate: true
      # Override tools@main hardcode (still 3.22) until tools alpine PR merges.
      # Last ALPINE_VERSION build-arg wins in docker build.
      build-args: ALPINE_VERSION=3.24
      checkout-ref: ${{ needs.authorize.outputs.sha }}
    secrets:
      slack-webhook: ${{ secrets.SLACK_WEBHOOK }}

  start-services:
    needs: authorize
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: trade-tariff/trade-tariff-tools/.github/actions/start-services@main
        with:
          service-names: backend-uk backend-xi worker-uk worker-xi
          environment: development

  validate-cloudwatch-queries:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [authorize, deploy]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - uses: ruby/setup-ruby@v1.327.0
        with:
          bundler-cache: true

      - id: environment-config
        uses: trade-tariff/trade-tariff-tools/.github/actions/configure-environment@main
        with:
          app-name: tariff-backend
          environment: development

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ steps.environment-config.outputs.deploy-role-arn }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Render dashboard queries
        env:
          CLOUDWATCH_QUERY_VALIDATION_LOG_GROUP: ${{ steps.environment-config.outputs.log-group }}
          CLOUDWATCH_DASHBOARD_QUERIES_FILE: /tmp/search-dashboard-queries.json
        run: bundle exec rake search_analytics:render_dashboard_queries

      - name: Validate CloudWatch queries
        env:
          CLOUDWATCH_DASHBOARD_QUERIES_FILE: /tmp/search-dashboard-queries.json
          CLOUDWATCH_QUERY_VALIDATION_LOG_GROUP: ${{ steps.environment-config.outputs.log-group }}
        run: bundle exec rake search_analytics:validate_cloudwatch_queries
