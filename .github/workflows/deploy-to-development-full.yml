name: Deploy to development full

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA or ref to deploy (defaults to current HEAD)'
        type: string
        required: false
  pull_request_target:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

jobs:
  authorize:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'needs-full-deployment') &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-full-deployment')) ||
      (github.event.pull_request.head.repo.full_name != github.repository &&
       contains(github.event.pull_request.labels.*.name, 'needs-fork-full-deployment') &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-fork-full-deployment'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: trade-tariff/trade-tariff-tools/.github/actions/authorize-development-deployment@main
        id: authorize

  deploy-full-stack:
    needs: authorize
    permissions:
      contents: read
      id-token: write
    uses: trade-tariff/trade-tariff-tools/.github/workflows/deploy-multi-ecs.yml@main
    with:
      environment: development
      apps: |
        [
          {
            "name": "tariff-backend",
            "ref": "${{ needs.authorize.outputs.sha }}",
            "migrate": true,
            "service-names": ["backend-uk", "backend-xi", "worker-uk", "worker-xi"]
          },
          {
            "name": "tariff-frontend",
            "repo": "trade-tariff/trade-tariff-frontend",
            "service-names": ["frontend"]
          },
          {
            "name": "tariff-admin",
            "repo": "trade-tariff/trade-tariff-admin",
            "migrate": true,
            "service-names": ["admin"]
          },
          {
            "name": "tariff-identity",
            "repo": "trade-tariff/identity",
            "service-names": ["identity"]
          },
          {
            "name": "tariff-dev-hub",
            "repo": "trade-tariff/trade-tariff-dev-hub",
            "migrate": true,
            "service-names": ["dev-hub"]
          }
        ]
      test-flavour: tariff
      migrate: true
    secrets:
      slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
      basic-password: ${{ secrets.BASIC_PASSWORD }}
      waf_bypass_token: ${{ secrets.TF_VAR_WAF_E2E_SECRET_TOKEN }}
