inherit_gem:
  rubocop-govuk:
    - config/default.yml
    - config/rails.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rspec
  - rubocop-performance

require:
  - ./lib/rubocop/cop/custom/sidekiq_complex_arguments.rb

AllCops:
  Exclude:
    - ".bundle/**/*"
    - ".direnv/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "bin/**"
    - "db/migrate/*"
    - "db/data_migrations/*"
    - "tmp/**/*"
    - "config/puma.rb"

RSpec:
  Language:
    ExampleGroups:
      Regular:
        - path
        - get
        - post
        - put
        - patch
        - delete
        - head
    Examples:
      Regular:
        - it_with_refresh_materialized_view
        - run_test!

# rswag requires let names to match HTTP header names (e.g. let(:Accept)), which are PascalCase.
RSpec/VariableName:
  Exclude:
    - 'spec/swagger/**/*'

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Max: 20

# Legacy codebase-wide policy cop with many existing offenses; left disabled
# until it can be split into focused refactors.
Metrics/BlockLength:
  Enabled: false

# Legacy codebase-wide policy cop with many existing offenses; left disabled
# until it can be split into focused refactors.
Metrics/ModuleLength:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: true
  Exclude:
    - spec/presenters/**/*
    - spec/serializers/**/*
    - spec/requests/**/*
    - spec/swagger/**/*

RSpec/ContextWording:
  Prefixes:
    - when
    - with
    - without
    - for

RSpec/MultipleMemoizedHelpers:
  Max: 10

# Legacy spec-shape policy cop with many existing offenses; left disabled until
# specs can be refactored in targeted behaviour-preserving changes.
RSpec/ExampleLength:
  Enabled: false

# Legacy spec-shape policy cop with many existing offenses; left disabled until
# specs can be refactored in targeted behaviour-preserving changes.
RSpec/NestedGroups:
  Enabled: false

# swagger:generate intentionally omits :environment — rswag:specs:swaggerize
# runs rspec in a subprocess and does not need Rails loaded in this process.
Rails/RakeEnvironment:
  Exclude:
    - 'lib/tasks/swagger.rake'

# This application uses Sequel datasets rather than ActiveRecord relations.
Rails/FindEach:
  Enabled: false

# This application uses Sequel rather than ActiveRecord.
Rails/FindBy:
  Enabled: false

# Sequel persistence methods do not have the same semantics as ActiveRecord's
# bang/non-bang persistence methods.
Rails/SaveBang:
  Enabled: false

# Legacy codebase-wide documentation policy cop with many existing offenses;
# left disabled until documentation standards can be introduced deliberately.
Style/Documentation:
  Enabled: false

Style/GuardClause:
  MinBodyLength: 2

Style/OptionalBooleanParameter:
  Exclude:
    - "app/workers/**/*.rb" # Sidekiq doesn't support kwargs syntax for jobs

Style/StringLiterals:
  EnforcedStyle: single_quotes

# Legacy spec-shape policy cop with many existing offenses; left disabled until
# specs can be refactored in targeted behaviour-preserving changes.
RSpec/IndexedLet:
  Enabled: false

# Legacy spec-shape policy cop with many existing offenses; left disabled until
# specs can be refactored in targeted behaviour-preserving changes.
RSpec/MultipleExpectations:
  Enabled: false

Custom/SidekiqComplexArguments:
  Enabled: true
  Description: 'Enforces scalar arguments (Integer, String, Boolean) for Sidekiq jobs.'
  Include:
    - 'app/**/*.rb'
