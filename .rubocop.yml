inherit_gem:
  rubocop-govuk:
    - config/default.yml
    - config/rails.yml
    - config/rspec.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rspec
  - rubocop-performance

require:
  - ./lib/rubocop/cop/custom/sidekiq_complex_arguments.rb

AllCops:
  Exclude:
    - ".bundle/**/*"
    - ".direnv/**/*"
    - "db/migrate/*"
    - "db/data_migrations/*"
    - "config/puma.rb"

RSpec:
  Language:
    ExampleGroups:
      Regular:
        - path
        - get
        - post
        - put
        - patch
        - delete
        - head
    Examples:
      Regular:
        - it_with_refresh_materialized_view
        - run_test!

# Rails route manifests are declarative DSL containers. Block length does not
# provide useful signal inside them, while the cop remains enforced elsewhere.
Metrics/BlockLength:
  Enabled: true
  Exclude:
    - 'app/engines/admin_api.rb'
    - 'app/engines/v1_api.rb'
    - 'app/engines/v2_api.rb'

Metrics/ModuleLength:
  Enabled: true

RSpec/ContextWording:
  Prefixes:
    - when
    - with
    - without
    - for

RSpec/MultipleMemoizedHelpers:
  Enabled: true

# swagger:generate intentionally omits :environment — rswag:specs:swaggerize
# runs rspec in a subprocess and does not need Rails loaded in this process.
Rails/RakeEnvironment:
  Exclude:
    - 'lib/tasks/swagger.rake'

# This application uses Sequel datasets rather than ActiveRecord relations.
Rails/FindEach:
  Enabled: false

# This application uses Sequel rather than ActiveRecord.
Rails/FindBy:
  Enabled: false

# Sequel persistence methods do not have the same semantics as ActiveRecord's
# bang/non-bang persistence methods.
Rails/SaveBang:
  Enabled: false

Style/OptionalBooleanParameter:
  Exclude:
    - "app/workers/**/*.rb" # Sidekiq doesn't support kwargs syntax for jobs

Style/StringLiterals:
  EnforcedStyle: single_quotes

Custom/SidekiqComplexArguments:
  Enabled: true
  Description: 'Enforces scalar arguments (Integer, String, Boolean) for Sidekiq jobs.'
  Include:
    - 'app/**/*.rb'
